<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Presensi Multi-Platform SMAN 8 Pekanbaru</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .camera-container { position: relative; width: 100%; height: 100%; min-height: 240px; background: #0f172a; overflow: hidden; }
        #video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        @media (min-width: 768px) { .camera-container { min-height: 340px; } }
        .admin-modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75); z-index: 100; backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 16px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-3 sm:p-6 md:p-8 text-slate-800">

    <!-- Kontainer Utama: Otomatis Melebar di Tablet/Laptop, Mengecil Ramah Jari di HP -->
    <div class="w-full max-w-sm md:max-w-3xl lg:max-w-4xl bg-white rounded-3xl shadow-xl shadow-slate-200/80 overflow-hidden relative border border-slate-100 flex flex-col transition-all duration-300">
        
        <!-- Header Banner: Konsisten di Semua Perangkat -->
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-5 sm:p-6 text-white text-center shadow-md">
            <h1 class="text-lg sm:text-xl md:text-2xl font-bold tracking-tight">E-PRESENSI SISWA</h1>
            <p class="text-blue-200 text-xs font-semibold tracking-wider mt-0.5">SMA NEGERI 8 PEKANBARU</p>
            <p id="displayTime" class="inline-block bg-white/10 text-white text-[11px] font-mono px-3 py-1 rounded-full mt-2.5 backdrop-blur-sm">Memuat waktu...</p>
        </div>

        <!-- Konten Flex Grid: 1 Kolom di HP, Otomatis 2 Kolom Seimbang di Tablet/Laptop (md:) -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 sm:gap-6 p-5 sm:p-6 md:p-8 bg-white">
            
            <!-- KOLOM KIRI: Form Pemilihan (Class & Student Selector) -->
            <div class="space-y-4 flex flex-col justify-center">
                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Pilih Kelas</label>
                    <select id="classSelect" onchange="loadStudents()" class="w-full p-3.5 sm:p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 focus:bg-white font-bold transition-all cursor-pointer text-sm sm:text-base appearance-none shadow-sm shadow-slate-100/50">
                        <option value="">-- MEMUAT KELAS... --</option>
                    </select>
                </div>

                <div class="space-y-1.5">
                    <label class="text-xs font-bold text-slate-400 uppercase tracking-wider">Nama Lengkap Siswa</label>
                    <select id="studentSelect" class="w-full p-3.5 sm:p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 focus:bg-white font-bold transition-all cursor-pointer text-sm sm:text-base appearance-none shadow-sm shadow-slate-100/50">
                        <option value="">-- Pilih Nama --</option>
                    </select>
                </div>

                <!-- Tampilan Jarak: Menyesuaikan Lebar Form -->
                <div id="distanceBox" class="p-3.5 rounded-2xl text-center text-xs font-bold bg-slate-50 text-slate-500 border border-slate-200/60 leading-relaxed shadow-sm">
                    Menghitung jarak Anda ke Sekolah...
                </div>
            </div>

            <!-- KOLOM KANAN: Jendela Kamera Kamera & Tombol Aksi -->
            <div class="space-y-4 flex flex-col justify-between">
                <div class="camera-container rounded-2xl shadow-inner shadow-black/40 border border-slate-100">
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="canvas" class="hidden"></canvas>
                    
                    <!-- Lapisan Tombol Aktivasi Kamera Awal -->
                    <div id="cameraStatus" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/95 text-center p-4 z-10">
                        <button onclick="setupCamera()" class="px-5 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl text-xs sm:text-sm font-bold shadow-lg shadow-blue-500/30 active:scale-95 transition-all">AKTIFKAN KAMERA</button>
                        <p id="camError" class="text-red-400 text-xs mt-3 hidden px-4"></p>
                    </div>
                    
                    <!-- Overlay Teks Status GPS Realtime -->
                    <div id="gps-info" class="absolute bottom-3 left-3 bg-slate-950/70 backdrop-blur-sm text-white text-[10px] px-3 py-1.5 rounded-full font-mono font-medium z-20 shadow-sm">📍 Mencari GPS...</div>
                </div>

                <!-- Tombol Submit Besar: Sangat Mudah Diklik di Jari HP, Proporsional di Laptop -->
                <button onclick="handleSubmit()" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 sm:py-4 rounded-2xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-2 text-sm sm:text-base active:scale-[0.99]">
                    SUBMIT KEHADIRAN
                </button>
            </div>
        </div>

        <!-- Penampung Pesan Status Log Pop-up Bawah -->
        <div id="statusMsg" class="mx-5 sm:mx-6 md:mx-8 mb-6 text-center text-xs font-bold py-3.5 rounded-2xl hidden border animate-pulse"></div>

        <!-- Ikon Kecil Gembok Admin Tersembunyi Rapi -->
        <button onclick="openAdmin()" class="absolute top-4 right-4 text-white/50 hover:text-white transition-colors p-1 rounded-lg hover:bg-white/10" title="Menu Admin">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"></path></svg>
        </button>
    </div>

    <!-- Modal Panel Pengaturan Admin Responsive (Mencegah Terpotong di Layar Kecil) -->
    <div id="adminPanel" class="admin-modal">
        <div class="bg-white w-full max-w-sm rounded-3xl p-5 sm:p-6 space-y-4 max-h-[90vh] overflow-y-auto border border-slate-100 shadow-2xl">
            <div class="text-center">
                <h2 class="text-base sm:text-lg font-bold text-slate-800">PENGATURAN SINKRONISASI SHEET</h2>
                <p class="text-slate-400 text-[11px] font-medium mt-0.5">Data tersimpan langsung ke Google Sheets</p>
            </div>
            <hr class="border-slate-100">
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Jam Masuk Sekolah</label>
                    <input type="time" id="setJamMasuk" class="w-full p-2.5 bg-slate-50 border border-slate-200/60 rounded-xl mt-1 font-bold text-sm text-slate-700 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Latitude Acuan Sekolah</label>
                    <input type="text" id="setLat" class="w-full p-2.5 bg-slate-50 border border-slate-200/60 rounded-xl mt-1 font-mono text-xs text-slate-600 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Longitude Acuan Sekolah</label>
                    <input type="text" id="setLng" class="w-full p-2.5 bg-slate-50 border border-slate-200/60 rounded-xl mt-1 font-mono text-xs text-slate-600 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Radius Batas Toleransi (Meter)</label>
                    <input type="number" id="setRad" class="w-full p-2.5 bg-slate-50 border border-slate-200/60 rounded-xl mt-1 font-bold text-sm text-slate-700 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Ubah Password Admin</label>
                    <input type="password" id="setPass" class="w-full p-2.5 bg-slate-50 border border-slate-200/60 rounded-xl mt-1 font-bold text-sm text-slate-700 focus:border-blue-500 outline-none">
                </div>
            </div>
            <div class="flex gap-2.5 pt-2">
                <button onclick="closeAdmin()" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl font-bold text-xs sm:text-sm transition-colors">BATAL</button>
                <button onclick="processSaveSettings()" class="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-xs sm:text-sm transition-colors shadow-md shadow-blue-600/10">SIMPAN CHANGES</button>
            </div>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT TETAP SINKRON DENGAN GOOGLE APP SCRIPT BACKEND ANDA -->
    <script>
        const API_URL = "MASUKKAN_URL_WEB_APP_ANDA_DISINI";

        let currentGPS = "Mencari...";
        let userLat = null, userLng = null;
        let studentData = [];
        let isWithinRange = false;
        let calculatedLiveDistance = 0;
        let adminSettings = { Jam_Masuk: "07:00", Admin_Password: "1234", Target_Latitude: 0.5057, Target_Longitude: 101.4633, Maks_Radius_Meter: 100 };

        window.onload = () => {
            setInterval(() => {
                document.getElementById('displayTime').innerText = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'medium' });
            }, 1000);
            loadClasses();
            setupGPS();
            fetchJSONP(`${API_URL}?action=getSettings`, (s) => { 
                if(s) { adminSettings = s; checkDistanceAndValidation(); }
            });
        };

        function fetchJSONP(url, callback) {
            const callbackName = 'jsonp_' + Math.round(100000 * Math.random());
            window[callbackName] = function(data) {
                delete window[callbackName];
                document.body.removeChild(script);
                callback(data);
            };
            const script = document.createElement('script');
            script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + callbackName;
            document.body.appendChild(script);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371000; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c; 
        }

        function checkDistanceAndValidation() {
            if (!userLat || !userLng) return;
            const targetLat = parseFloat(adminSettings.Target_Latitude);
            const targetLng = parseFloat(adminSettings.Target_Longitude);
            const maxRadius = parseFloat(adminSettings.Maks_Radius_Meter);

            calculatedLiveDistance = calculateDistance(userLat, userLng, targetLat, targetLng);
            const distBox = document.getElementById('distanceBox');
            const btn = document.getElementById('btnSubmit');

            if (calculatedLiveDistance <= maxRadius) {
                isWithinRange = true;
                distBox.className = "p-3.5 rounded-2xl text-center text-xs font-bold bg-emerald-50 text-emerald-800 border border-emerald-200/60 shadow-sm";
                distBox.innerHTML = `🏁 Area Absen Terverifikasi <br><span class="font-mono text-[11px] font-normal text-emerald-600">(Jarak: ${calculatedLiveDistance.toFixed(1)} meter dari SMAN 8)</span>`;
                btn.disabled = false;
                btn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 sm:py-4 rounded-2xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-2 text-sm sm:text-base cursor-pointer";
            } else {
                isWithinRange = false;
                distBox.className = "p-3.5 rounded-2xl text-center text-xs font-bold bg-rose-50 text-rose-800 border border-rose-200/60 shadow-sm";
                distBox.innerHTML = `🚨 Di Luar Jangkauan Sekolah! <br><span class="font-mono text-[11px] font-normal text-rose-600">(Posisi: Jauh ${calculatedLiveDistance.toFixed(1)}m / Batas: ${maxRadius}m)</span>`;
                btn.disabled = true;
                btn.className = "w-full bg-slate-300 text-slate-500 font-bold py-3.5 sm:py-4 rounded-2xl shadow-none cursor-not-allowed flex items-center justify-center gap-2 text-sm sm:text-base";
            }
        }

        function loadClasses() {
            fetchJSONP(`${API_URL}?action=getClasses`, (classes) => {
                const sel = document.getElementById('classSelect');
                if (!classes || classes.length === 0) { sel.innerHTML = '<option value="">(Data Kosong)</option>'; return; }
                sel.innerHTML = '<option value="">-- Pilih Kelas --</option>';
                classes.forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
            });
        }

        function loadStudents() {
            const className = document.getElementById('classSelect').value;
            const sel = document.getElementById('studentSelect');
            if (!className) { sel.innerHTML = '<option value="">-- Pilih Nama --</option>'; return; }
            sel.innerHTML = '<option value="">Mencari siswa...</option>';
            fetchJSONP(`${API_URL}?action=getStudents&className=${encodeURIComponent(className)}`, (students) => {
                studentData = students;
                sel.innerHTML = '<option value="">-- Pilih Nama --</option>';
                students.forEach(s => sel.innerHTML += `<option value="${s.id}">${s.name}</option>`);
            });
        }

        async function setupCamera() {
            const video = document.getElementById('video');
            const statusBox = document.getElementById('cameraStatus');
            const errEl = document.getElementById('camError');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = stream; statusBox.style.display = 'none';
            } catch (err) {
                try {
                    const fallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallback; statusBox.style.display = 'none'; video.style.transform = "none";
                } catch(e) {
                    errEl.innerText = "Sistem gagal membuka hardware modul kamera."; errEl.classList.remove('hidden');
                }
            }
        }

        function setupGPS() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(pos => {
                    userLat = pos.coords.latitude; userLng = pos.coords.longitude;
                    currentGPS = `${userLat.toFixed(6)}, ${userLng.toFixed(6)}`;
                    document.getElementById('gps-info').innerText = `📍 Terkunci: ${currentGPS}`;
                    checkDistanceAndValidation();
                }, () => {
                    document.getElementById('gps-info').innerText = `📍 GPS: Silakan Aktifkan Lokasi HP`;
                }, { enableHighAccuracy: true });
            }
        }

        function handleSubmit() {
            if(!isWithinRange) { alert("Sistem mendeteksi Anda di luar radius aman SMAN 8 Pekanbaru!"); return; }
            const studentId = document.getElementById('studentSelect').value;
            const className = document.getElementById('classSelect').value;
            const student = studentData.find(s => s.id == studentId);
            if (!className || !studentId || !student) return alert("Silakan lengkapi pilihan kelas dan nama!");
            
            const video = document.getElementById('video');
            if (!video.srcObject) return alert("Kamera absensi belum diaktifkan!");

            const btn = document.getElementById('btnSubmit');
            const msg = document.getElementById('statusMsg');
            btn.disabled = true; btn.innerText = "SEDANG MENGIRIM DATA...";

            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth || 640; canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            if (video.style.transform !== "none") { ctx.translate(canvas.width, 0); ctx.scale(-1, 1); }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            ctx.setTransform(1, 0, 0, 1, 0, 0);

            ctx.fillStyle = "rgba(15, 23, 42, 0.7)"; ctx.fillRect(0, canvas.height - 90, canvas.width, 90);
            ctx.fillStyle = "#ffffff"; ctx.font = "bold 16px Arial";
            ctx.fillText(`Nama: ${student.name} (${className})`, 20, canvas.height - 60);
            ctx.fillText(`Waktu: ${new Date().toLocaleString('id-ID')}`, 20, canvas.height - 35);
            ctx.fillText(`Jarak Riil: ${calculatedLiveDistance.toFixed(1)} Meter`, 20, canvas.height - 15);

            const payload = {
                action: "record", studentId: studentId, studentName: student.name,
                className: className, parentEmail: student.email, gps: currentGPS,
                image: canvas.toDataURL('image/jpeg', 0.5)
            };

            fetch(API_URL, { method: "POST", body: JSON.stringify(payload) })
            .then(res => res.json())
            .then(res => {
                msg.innerText = res.message;
                msg.className = `mx-5 sm:mx-6 md:mx-8 mb-6 text-center text-xs font-bold p-4 rounded-2xl border ${res.success ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-rose-50 text-rose-800 border-rose-200'}`;
                msg.classList.remove('hidden');
                if (res.success) setTimeout(() => { location.reload(); }, 3000);
                else { btn.disabled = false; btn.innerText = "SUBMIT KEHADIRAN"; }
            }).catch(() => {
                alert("Koneksi gagal terhubung ke Google Server.");
                btn.disabled = false; btn.innerText = "SUBMIT KEHADIRAN";
            });
        }

        function openAdmin() {
            const pass = prompt("Masukkan Password Konfigurasi Admin:");
            if (pass === adminSettings.Admin_Password.toString()) {
                document.getElementById('setJamMasuk').value = adminSettings.Jam_Masuk;
                document.getElementById('setPass').value = adminSettings.Admin_Password;
                document.getElementById('setLat').value = adminSettings.Target_Latitude;
                document.getElementById('setLng').value = adminSettings.Target_Longitude;
                document.getElementById('setRad').value = adminSettings.Maks_Radius_Meter;
                document.getElementById('adminPanel').style.display = 'flex';
            } else if(pass !== null) { alert("Akses Ditolak: Password Salah!"); }
        }
        function closeAdmin() { document.getElementById('adminPanel').style.display = 'none'; }
        
        function processSaveSettings() {
            const jam = document.getElementById('setJamMasuk').value;
            const pass = document.getElementById('setPass').value;
            const lat = document.getElementById('setLat').value;
            const lng = document.getElementById('setLng').value;
            const rad = document.getElementById('setRad').value;
            
            fetch(API_URL, { 
                method: "POST", 
                body: JSON.stringify({ action: "saveSettings", jam: jam, pass: pass, lat: lat, lng: lng, rad: rad }) 
            })
            .then(res => res.json()).then(res => { alert(res.message); location.reload(); });
        }
    </script>
</body>
</html>
